name: JMA data update

on:
  schedule:
    # 15分間隔（cron は最短5分だが、レート制限と運用余裕のため15分）
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: jma-data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run fail-closed fetch regression tests
        run: node --test scripts/fetch-jma-data.test.mjs

      - name: Fetch JMA data
        run: node scripts/fetch-jma-data.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/src/data/jma; then
            echo "No JMA changes"
            exit 0
          fi
          git add web/src/data/jma
          git config --local core.hooksPath /dev/null
          git commit -m "chore(jma): scheduled data update [skip ci]"
          # Rebase, scan the immutable commit, then fast-forward the default branch.
          git show HEAD:scripts/maintenance/push-with-storage-gate.sh | bash
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_ALLOWED_PATHS: web/src/data/jma/earthquakes.json:web/src/data/jma/index.json:web/src/data/jma/warnings.json:web/src/data/jma/weather.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
