name: newsletter-weekly

on:
  # 一次資料で検証済みの週次コンテンツ生成が整うまでは自動配信しない。
  # 手動実行も既定はdry-runで、明示的にfalseを選んだ場合だけ送信可能。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（実際には送信しない）"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: newsletter-weekly
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send newsletter
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_AUDIENCE_ID: ${{ secrets.NEWSLETTER_AUDIENCE_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          ALLOW_NEWSLETTER_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false' && 'true' || 'false' }}
        run: |
          SEND_FLAG="--dry-run"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            SEND_FLAG="--send"
          fi
          node scripts/send-newsletter.mjs "$SEND_FLAG"
