name: News feed (RSS + human review queue)

on:
  schedule:
    # Daily 06:00 JST  =  21:00 UTC (previous day)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: news-feed-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Stage 1 — fetch RSS feeds (keyword filter + dedupe)
        run: node scripts/etl/fetch-news-feed.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Stage 2 — deterministic filter + human review queue
        run: node scripts/etl/news-ai-judge.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Stage 3 — recompute audit dashboard stats
        run: node scripts/etl/news-feed-stats.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/src/data/news-feed; then
            echo "No news-feed changes"
            exit 0
          fi
          git add web/src/data/news-feed
          git config --local core.hooksPath /dev/null
          git commit -m "chore(news-feed): scheduled autonomous refresh [skip ci]"
          git show HEAD:scripts/maintenance/push-with-storage-gate.sh | bash
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_ALLOWED_PATHS: web/src/data/news-feed/approved/index.json:web/src/data/news-feed/pending/index.json:web/src/data/news-feed/rejected/index.json:web/src/data/news-feed/stats.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
