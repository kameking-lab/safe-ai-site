name: News feed (RSS + human review queue)

on:
  schedule:
    # Daily 06:00 JST  =  21:00 UTC (previous day)
    - cron: "0 21 * * *"
  repository_dispatch:
    types: [news-feed-daily]
permissions:
  contents: read

concurrency:
  group: news-feed-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.payload.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze generation base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Stage 1 — fetch RSS feeds (keyword filter + dedupe)
        run: node scripts/etl/fetch-news-feed.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Stage 2 — deterministic filter + human review queue
        run: node scripts/etl/news-ai-judge.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Stage 3 — recompute audit dashboard stats
        run: node scripts/etl/news-feed-stats.mjs
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Prepare exact data artifact
        id: payload
        run: |
          if git diff --quiet -- web/src/data/news-feed; then
            echo "No news-feed changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          payload="$RUNNER_TEMP/storage-payload"
          repo_root="$(git rev-parse --show-toplevel)"
          for path in \
            web/src/data/news-feed/approved/index.json \
            web/src/data/news-feed/pending/index.json \
            web/src/data/news-feed/rejected/index.json \
            web/src/data/news-feed/stats.json; do
            test -f "$path" && test ! -L "$path"
            test "$(realpath -e -- "$path")" = "$repo_root/$path"
            install -D -m 0644 -- "$path" "$payload/$path"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated data only
        if: steps.payload.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-storage-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-payload/
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - name: Checkout frozen default-branch base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.refresh.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download generated data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: news-storage-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-payload

      - name: Validate, scan and promote immutable data commit
        run: bash scripts/maintenance/promote-storage-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
          STORAGE_ARTIFACT_ROOT: ${{ runner.temp }}/storage-payload
          STORAGE_COMMIT_MESSAGE: "chore(news-feed): scheduled autonomous refresh [skip ci]"
          STORAGE_ALLOWED_PATHS: web/src/data/news-feed/approved/index.json:web/src/data/news-feed/pending/index.json:web/src/data/news-feed/rejected/index.json:web/src/data/news-feed/stats.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
