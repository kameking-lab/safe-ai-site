name: web-ci

on:
  workflow_dispatch:
    inputs:
      run_full:
        description: "fullジョブを実行する"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  apple-billing-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prepare disposable local billing database
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55437/postgres?schema=sp7_billing
        run: npx prisma db push --skip-generate
      - name: Verify HTTP receipt transfer with PostgreSQL
        env:
          ANZEN_BILLING_INTEGRATION: "1"
        run: npx vitest run src/lib/mobile/apple-transfer.integration.test.ts --maxWorkers=1

  smoke:
    runs-on: ubuntu-24.04
    # A cold hosted runner currently needs about 15 minutes for install, lint,
    # build, all unit tests, browser install, and live smoke. Leave bounded
    # headroom so a fully successful final step is not cancelled at teardown.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (live mode)
        env:
          PLAYWRIGHT_SERVER_MODE: production
        run: npm run test:e2e:smoke

      - name: Upload Playwright artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  full:
    if: github.event_name == 'push' || github.event.inputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.1"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_MODE: "live"
          NEXT_PUBLIC_SUPABASE_URL: "https://playwright.invalid"
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E full tests (live mode)
        env:
          PLAYWRIGHT_SERVER_MODE: production
        run: npm run test:e2e:ci

      - name: Upload Playwright artifacts (full)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-artifacts
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
