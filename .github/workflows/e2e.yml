name: e2e

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The production build, Chromium setup, and the full browser matrix take
    # more than 20 minutes on a cold hosted runner. Keep a bounded ceiling
    # while allowing the complete suite to finish instead of cancelling it.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin the current patched Node 22 LTS security release.
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public values are compiled into the client bundle. Keep the
          # positive cloud-consent and live-service branches observable while
          # every provider remains an unreachable Playwright placeholder.
          NEXT_PUBLIC_API_MODE: "live"
          NEXT_PUBLIC_SUPABASE_URL: "https://playwright.invalid"
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify production strict CSP
        env:
          # Prove the nonce/strict-dynamic branch on the same immutable build
          # used by the full functional suite.
          PLAYWRIGHT_SERVER_MODE: production
        run: npx playwright test e2e/csp-runtime.spec.ts

      - name: Run E2E tests
        env:
          # Reuse the immutable build instead of compiling 250 tests through a
          # memory-growing HMR server. Route interception and dry-run provider
          # fixtures remain configured by playwright.config.ts.
          PLAYWRIGHT_SERVER_MODE: production
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Comment on PR (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('E2Eテスト失敗'));
            const body = `## E2Eテスト失敗 :x:

            E2Eテストが失敗しました。Playwright レポートをアーティファクトで確認してください。

            **ワークフロー実行:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
