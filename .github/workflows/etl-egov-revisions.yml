name: e-Gov law revisions ETL

on:
  schedule:
    # 毎週月曜 09:00 JST = 00:00 UTC（週次。反映ラグ短縮 P2-3。diff-onlyのため無料枠内）
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: etl-egov-revisions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Install deps (tsx)
        run: npm ci

      - name: Verify fail-closed ETL guards (synthetic fixtures only)
        run: npx vitest run src/data/law-revisions/egov-revisions-fetch.test.ts

      - name: Fetch e-Gov law revisions (structural data only)
        run: npx tsx scripts/etl/egov-revisions-fetch.ts
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Commit if changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/src/data/law-revisions/egov-revisions.json; then
            echo "No e-Gov revision changes"
            exit 0
          fi
          git add web/src/data/law-revisions/egov-revisions.json
          git config --local core.hooksPath /dev/null
          git commit -m "chore(news): e-Gov law revisions update [skip ci]"
          git show HEAD:scripts/maintenance/push-with-storage-gate.sh | bash
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_ALLOWED_PATHS: web/src/data/law-revisions/egov-revisions.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
