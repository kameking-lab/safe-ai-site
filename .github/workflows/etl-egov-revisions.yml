name: e-Gov law revisions ETL

on:
  schedule:
    # 毎週月曜 09:00 JST = 00:00 UTC（週次。反映ラグ短縮 P2-3。diff-onlyのため無料枠内）
    - cron: "0 0 * * 1"
  repository_dispatch:
    types: [egov-revisions-update]
permissions:
  contents: read

concurrency:
  group: etl-egov-revisions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.payload.outputs.changed }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze generation base
        id: base
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Install deps (tsx)
        run: npm ci

      - name: Verify fail-closed ETL guards (synthetic fixtures only)
        run: npx vitest run src/data/law-revisions/egov-revisions-fetch.test.ts

      - name: Fetch e-Gov law revisions (structural data only)
        run: npx tsx scripts/etl/egov-revisions-fetch.ts
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Prepare exact data artifact
        id: payload
        working-directory: .
        run: |
          if git diff --quiet -- web/src/data/law-revisions/egov-revisions.json; then
            echo "No e-Gov revision changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path=web/src/data/law-revisions/egov-revisions.json
          repo_root="$(git rev-parse --show-toplevel)"
          test -f "$path" && test ! -L "$path"
          test "$(realpath -e -- "$path")" = "$repo_root/$path"
          install -D -m 0644 -- "$path" "$RUNNER_TEMP/storage-payload/$path"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated data only
        if: steps.payload.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: egov-storage-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-payload/
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - name: Checkout frozen default-branch base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.fetch.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download generated data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: egov-storage-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-payload

      - name: Validate, scan and promote immutable data commit
        run: bash scripts/maintenance/promote-storage-artifact.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ needs.fetch.outputs.base_sha }}
          STORAGE_ARTIFACT_ROOT: ${{ runner.temp }}/storage-payload
          STORAGE_COMMIT_MESSAGE: "chore(news): e-Gov law revisions update [skip ci]"
          STORAGE_ALLOWED_PATHS: web/src/data/law-revisions/egov-revisions.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
