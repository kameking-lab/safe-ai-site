name: storage-budget

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Reachable candidate commit to scan and authorize"
        required: false
        type: string
      request_id:
        description: "Unique trusted automation request identifier"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows:
      - JMA data update
      - News feed (RSS + human review queue)
      - e-Gov law revisions ETL
      - MHLW monthly sokuhou ETL
    types:
      - completed
  # Commit-message skip directives do not suppress pull_request_target. The job
  # below checks out PR content as data only and never executes repository code.
  pull_request_target:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: storage-budget-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && format('candidate-{0}', inputs.target_sha)) || github.ref }}
  # Every main push must finish so an add-then-delete sequence cannot hide a
  # forbidden history blob behind a cancelled incremental run.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable storage target
        if: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.target_sha != '') }}
        env:
          EXPECTED_TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            if [[ ! "$EXPECTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Immutable storage target is missing or invalid.'
              exit 1
            fi
            if [[ ! "$REQUEST_ID" =~ ^automation-[0-9]+-[0-9]+-[1-3]$ ]]; then
              echo '::error::Trusted automation request identifier is missing or invalid.'
              exit 1
            fi
          else
            for value in "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA"; do
              if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
                echo '::error::Immutable PR commit metadata is missing or invalid.'
                exit 1
              fi
            done
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::Immutable PR number is missing or invalid.'
              exit 1
            fi
          fi

      - name: Resolve immutable PR merge ref
        id: resolve_pr_merge
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          remote_url="https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in $(seq 1 12); do
            merge_sha="$(git ls-remote "$remote_url" "refs/pull/$PR_NUMBER/merge" | awk 'NR == 1 {print $1}')"
            if [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Trusted PR merge ref was not available within 60 seconds.'
          exit 1

      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # The trusted workflow treats PR files strictly as data: it executes no
          # checked-out script, action, package, hook, or import. The ref is first
          # resolved from the base repository, credentials are never persisted,
          # and its exact event base/head parents are verified below.
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          ref: ${{ github.event_name == 'pull_request_target' && steps.resolve_pr_merge.outputs.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha) || github.sha }}

      - name: Verify inspected workflow-dispatch commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
        env:
          EXPECTED_TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_TARGET_SHA" ]; then
            echo '::error::Checked out commit does not match the immutable dispatch target.'
            exit 1
          fi

      - name: Verify inspected PR merge commit
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          read -r actual parent_one parent_two extra <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ -z "$actual" ] || [ -z "$parent_one" ] || [ -z "$parent_two" ] || [ -n "$extra" ]; then
            echo '::error::Inspected PR target is not an exact two-parent merge commit.'
            exit 1
          fi
          if ! { [ "$parent_one" = "$EXPECTED_BASE_SHA" ] && [ "$parent_two" = "$EXPECTED_HEAD_SHA" ]; } && \
             ! { [ "$parent_one" = "$EXPECTED_HEAD_SHA" ] && [ "$parent_two" = "$EXPECTED_BASE_SHA" ]; }; then
            echo '::error::Inspected PR merge parents do not match the immutable event base and head.'
            exit 1
          fi

      - name: Enforce repository storage budgets
        env:
          STORAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          STORAGE_FULL_TREE: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          current_directory = os.path.realpath(os.getcwd())
          if any(
              entry and os.path.realpath(entry) == current_directory
              for entry in sys.path
          ):
              print("::error::Python isolated mode did not remove the untrusted checkout from sys.path")
              sys.exit(1)

          MIB = 1024 * 1024
          MAX_NEW_TRACKED = 5 * MIB
          MAX_SINGLE_FILE = 100 * MIB
          MAX_UNTRACKED_COUNT = 1_000
          MAX_NON_RUNTIME_MEDIA_COUNT = 100
          MAX_REPOSITORY_NON_RUNTIME_MEDIA_COUNT = 125
          MAX_NON_RUNTIME_MEDIA_BYTES = 20 * MIB
          # Immutable policy epoch. Every run inspects all added/modified blobs
          # after this commit, so a GitHub-native [skip ci] commit cannot hide a
          # forbidden add-then-delete sequence from the next run or daily audit.
          POLICY_HISTORY_BASE_SHA = "83f604e3a151fe645b594e2ca17b91cfa2435eae"

          # Large source datasets are intentional only in these reviewed runtime trees.
          # This includes legal, chemical, qualification, accident, KYT, source snapshots,
          # public images, schema/migrations, and their committed test fixtures.
          LARGE_RUNTIME_ALLOWLIST = (
              "data/",
              "web/src/data/",
              "web/public/",
              "web/prisma/",
              "web/src/fixtures/",
              "web/src/__fixtures__/",
              "web/test/fixtures/",
              "web/tests/fixtures/",
              "web/e2e/fixtures/",
          )

          COMPACT_EVIDENCE_FILES = {
              "README.md",
              "manifest.json",
              "checksum-manifest.json",
              "independent-review.md",
              "quality-gates-automated.json",
              "preview-conversation-audit.json",
              "conversation-evaluation.json",
              "production-smoke.json",
              "external-boundary.json",
          }
          RAW_EVIDENCE_SUFFIXES = {
              ".har", ".html", ".log", ".trace", ".zip", ".gz", ".tgz",
              ".mp4", ".webm", ".png", ".jpg", ".jpeg", ".gif", ".webp",
              ".jsonl", ".lcov",
          }
          PUBLIC_RUNTIME_MEDIA_SUFFIXES = {
              ".ico", ".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp",
              ".avif", ".mp4", ".webm", ".woff", ".woff2", ".ttf",
          }
          PUBLIC_RUNTIME_EXACT_PATHS = {
              "web/public/ads.txt",
              "web/public/offline.html",
              "web/public/print.css",
              "web/public/sw.js",
              "web/public/manifest.json",
              "web/public/screenshots/manifest.json",
              "web/public/geo/japan-prefectures-ne10m.json",
          }
          MEDIA_OR_JSON_SUFFIXES = {
              ".json", ".jsonl", ".png", ".jpg", ".jpeg", ".gif", ".webp",
              ".avif", ".svg",
          }
          GENERATED_SEGMENTS = {
              ".next", "out", "build", "dist", "coverage", "test-results", "playwright-report",
              "audit-out", ".turbo", ".cache", "lighthouse-raw", "lighthouse-trace",
              "lighthouse-results", ".lighthouseci", "trace", "traces", "videos",
              "tmp", ".tmp", "benchmark-output", ".benchmark-output", ".bench", ".genquality",
              ".local-evidence", ".ci-performance-evidence", ".maintenance-snapshots",
              "local-snapshots", "logs",
          }

          def run_bytes(*args: str) -> bytes:
              return subprocess.check_output(args)

          def valid_commit(value: str) -> bool:
              if not value or set(value) == {"0"}:
                  return False
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{value}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          base = os.environ.get("STORAGE_BASE_SHA", "").strip()
          if not valid_commit(base):
              fallback = subprocess.run(
                  ["git", "rev-parse", "HEAD^"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              base = fallback.stdout.strip() if fallback.returncode == 0 else ""

          if base:
              changed_raw = run_bytes(
                  "git", "diff", "--no-renames", "--diff-filter=ACMT", "--name-only", "-z", f"{base}...HEAD"
              )
          else:
              changed_raw = run_bytes("git", "ls-files", "-z")

          changed = [
              item.decode("utf-8", errors="surrogateescape").replace("\\", "/")
              for item in changed_raw.split(b"\0")
              if item
          ]
          changed_set = set(changed)
          full_tree_scan = os.environ.get("STORAGE_FULL_TREE", "").lower() == "true"
          scan_raw = run_bytes("git", "ls-files", "-z") if full_tree_scan else changed_raw
          scan_paths = [
              item.decode("utf-8", errors="surrogateescape").replace("\\", "/")
              for item in scan_raw.split(b"\0")
              if item
          ]
          failures: list[str] = []
          allowed_large: list[str] = []
          non_runtime_media: list[tuple[str, int]] = []
          history_non_runtime_media: list[tuple[str, int]] = []

          def is_public_runtime_allowed(path: str) -> bool:
              if not path.startswith("web/public/"):
                  return False
              suffix = PurePosixPath(path).suffix.lower()
              seminar_relative = path.removeprefix("web/public/seminars/")
              direct_seminar_pptx = (
                  path.startswith("web/public/seminars/")
                  and "/" not in seminar_relative
                  and suffix == ".pptx"
              )
              return (
                  suffix in PUBLIC_RUNTIME_MEDIA_SUFFIXES
                  or path in PUBLIC_RUNTIME_EXACT_PATHS
                  or direct_seminar_pptx
              )

          def is_forbidden_public_raw(path: str) -> bool:
              return path.startswith("web/public/") and not is_public_runtime_allowed(path)

          def is_runtime_allowed(path: str) -> bool:
              if path.startswith("web/public/"):
                  return is_public_runtime_allowed(path)
              return path.startswith(LARGE_RUNTIME_ALLOWLIST)

          def is_generated_artifact(path: str) -> bool:
              parts = PurePosixPath(path).parts
              if "node_modules" in parts:
                  return True
              if any(
                  parts[index] == ".vercel" and parts[index + 1] == "output"
                  for index in range(len(parts) - 1)
              ):
                  return True
              if "screenshots" in parts and not path.startswith("web/public/screenshots/"):
                  return True
              generated_prefixes = (
                  "test-results-", "playwright-report-", "lighthouse-raw-",
                  "lighthouse-trace-",
              )
              root_index = 1 if parts and parts[0] == "web" else 0
              generated_root = parts[root_index] if len(parts) > root_index else ""
              unique_generated_segments = {
                  ".next", ".turbo", ".cache", ".local-evidence",
                  ".ci-performance-evidence", ".maintenance-snapshots",
                  "node_modules",
              }
              if (
                  generated_root in GENERATED_SEGMENTS
                  or generated_root.startswith(generated_prefixes)
                  or any(part in unique_generated_segments for part in parts)
              ):
                  return True
              basename = PurePosixPath(path).name
              return path.endswith((".lhr.json", ".har", ".lcov", ".trace", ".log", ".tmp")) or (
                  basename.startswith("lh5d-noimg") and basename.endswith(".json")
              )

          def is_audit_evidence(path: str) -> bool:
              return path.startswith("docs/audits/evidence/") or "/docs/audits/evidence/" in f"/{path}"

          def is_forbidden_audit_evidence(path: str) -> bool:
              if not is_audit_evidence(path):
                  return False
              parts = PurePosixPath(path).parts
              suffix = PurePosixPath(path).suffix.lower()
              basename = PurePosixPath(path).name
              raw_dir = any(
                  part in {"raw", "screenshots", "traces", "videos", "playwright-report", "test-results", "lighthouse-runs"}
                  for part in parts
              )
              return raw_dir or suffix in RAW_EVIDENCE_SUFFIXES or basename not in COMPACT_EVIDENCE_FILES

          def media_budget_exceeded(entries: list[tuple[str, int]], count_budget: int) -> bool:
              return (
                  len(entries) > count_budget
                  or sum(size for _, size in entries) > MAX_NON_RUNTIME_MEDIA_BYTES
              )

          classifier_probes = (
              ".local-evidence/run.log",
              ".ci-performance-evidence/result.json",
              ".maintenance-snapshots/tree.json",
              "local-snapshots/tree.json",
              "web/build/result.js",
              "web/dist/result.js",
              "web/lighthouse-raw-1/result.json",
              "web/.vercel/output/functions/api.func/index.js",
              "web/logs/run.log",
              "root-debug.log",
              "artifact.tmp",
              "lh5d-noimg-run.json",
          )
          if any(not is_generated_artifact(path) for path in classifier_probes):
              failures.append("storage classifier self-test failed")
          if (
              is_generated_artifact("web/public/screenshots/runtime-guide.png")
              or is_generated_artifact("web/public/videos/training.mp4")
          ):
              failures.append("runtime media classifier self-test failed")
          if is_generated_artifact("web/src/app/build/page.tsx") or is_generated_artifact("web/src/app/trace/page.tsx"):
              failures.append("source route classifier self-test failed")
          if (
              is_forbidden_public_raw("web/public/screenshots/runtime-guide.png")
              or is_forbidden_public_raw("web/public/videos/training.mp4")
              or is_forbidden_public_raw("web/public/manifest.json")
              or is_forbidden_public_raw("web/public/seminars/teiatsu-denki.pptx")
              or not is_forbidden_public_raw("web/public/seminars/raw/unreviewed.pptx")
              or not is_forbidden_public_raw("web/public/session.zip")
              or not is_forbidden_public_raw("web/public/prod.sqlite")
              or not is_forbidden_public_raw("web/public/export.ndjson")
              or not is_forbidden_public_raw("web/public/database-backup")
              or not is_forbidden_public_raw("web/public/prod.sqlite-wal")
              or not is_forbidden_public_raw("web/public/export.parquet")
          ):
              failures.append("public runtime allowlist classifier self-test failed")
          if not is_generated_artifact("web/node_modules/pkg/dist/index.js"):
              failures.append("node_modules classifier self-test failed")
          if sum(
              1 for index in range(MAX_UNTRACKED_COUNT + 1)
              if is_generated_artifact(f"web/test-results-probe/{index}.json")
          ) <= MAX_UNTRACKED_COUNT:
              failures.append("untracked generated-file budget self-test failed")
          if not media_budget_exceeded(
              [(f"docs/probe-{index}.png", 1) for index in range(MAX_NON_RUNTIME_MEDIA_COUNT + 1)],
              MAX_NON_RUNTIME_MEDIA_COUNT,
          ):
              failures.append("non-runtime media count budget self-test failed")
          if not media_budget_exceeded(
              [(f"docs/probe-{index}.json", 4 * MIB) for index in range(6)],
              MAX_NON_RUNTIME_MEDIA_COUNT,
          ):
              failures.append("non-runtime media byte budget self-test failed")

          for path in scan_paths:
              file_path = Path(path)
              try:
                  metadata = file_path.lstat()
              except OSError:
                  failures.append(f"tracked file cannot be read without following links: {path}")
                  continue
              if not stat.S_ISREG(metadata.st_mode):
                  failures.append(f"tracked source is not a regular file: {path}")
                  continue
              size = metadata.st_size
              suffix = file_path.suffix.lower()
              basename = file_path.name
              changed_path = path in changed_set

              if changed_path or full_tree_scan:
                  if size > MAX_SINGLE_FILE:
                      failures.append(f"single file exceeds 100 MiB: {path} ({size} bytes)")
                  elif size >= MAX_NEW_TRACKED:
                      if is_runtime_allowed(path):
                          allowed_large.append(f"{path} ({size} bytes)")
                      else:
                          failures.append(f"new tracked file exceeds 5 MiB: {path} ({size} bytes)")

              if is_generated_artifact(path):
                  failures.append(f"generated build/test artifact is tracked: {path}")

              if is_forbidden_public_raw(path):
                  failures.append(f"raw archive/dump must not be deployed from public: {path}")

              if is_forbidden_audit_evidence(path):
                  failures.append(f"raw/non-current audit evidence is tracked: {path}")

              if (changed_path or full_tree_scan) and suffix in MEDIA_OR_JSON_SUFFIXES and not is_runtime_allowed(path):
                  non_runtime_media.append((path, size))

          history_blob_count = 0
          history_range_ready = valid_commit(POLICY_HISTORY_BASE_SHA)
          if not history_range_ready:
              failures.append(
                  "immutable storage policy history baseline is unavailable: "
                  f"{POLICY_HISTORY_BASE_SHA}"
              )
          elif subprocess.run(
              ["git", "merge-base", "--is-ancestor", POLICY_HISTORY_BASE_SHA, "HEAD"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          ).returncode != 0:
              history_range_ready = False
              failures.append(
                  "HEAD does not descend from the immutable storage policy history baseline"
              )

          if history_range_ready:
              # Inspect each commit's new tree path, not `rev-list --objects`.
              # The latter drops an added path when its blob already existed in
              # the base tree and is therefore unsafe for copy-then-delete cases.
              history_entries: list[tuple[bytes, str]] = []
              seen_history_entries: set[tuple[bytes, str]] = set()
              commit_ids = run_bytes(
                  "git", "rev-list", "--reverse", f"{POLICY_HISTORY_BASE_SHA}..HEAD"
              ).splitlines()
              for commit_id in commit_ids:
                  raw_changes = run_bytes(
                      "git", "diff-tree", "--root", "-m", "--no-commit-id",
                      "--no-renames", "-r", "--raw", "-z", "--diff-filter=ACMT",
                      commit_id.decode("ascii"),
                  ).split(b"\0")
                  index = 0
                  while index + 1 < len(raw_changes):
                      header = raw_changes[index]
                      raw_path = raw_changes[index + 1]
                      index += 2
                      fields = header.split()
                      if len(fields) < 5 or not header.startswith(b":") or not raw_path:
                          continue
                      object_id = fields[3]
                      if not object_id or set(object_id) == {ord("0")}:
                          continue
                      path = raw_path.decode(
                          "utf-8", errors="surrogateescape"
                      ).replace("\\", "/")
                      if fields[1] not in {b"100644", b"100755"}:
                          failures.append(
                              f"non-regular source entered history: {path} "
                              f"(mode {fields[1].decode('ascii', errors='replace')})"
                          )
                          continue
                      entry = (object_id, path)
                      if entry not in seen_history_entries:
                          seen_history_entries.add(entry)
                          history_entries.append(entry)

              object_ids = sorted({object_id for object_id, _ in history_entries})
              if object_ids:
                  inspected = subprocess.run(
                      [
                          "git",
                          "cat-file",
                          "--batch-check=%(objectname) %(objecttype) %(objectsize)",
                      ],
                      input=b"\n".join(object_ids) + b"\n",
                      stdout=subprocess.PIPE,
                      check=True,
                  ).stdout.splitlines()
                  object_sizes: dict[bytes, int] = {}
                  for line in inspected:
                      fields = line.split()
                      if len(fields) != 3 or fields[1] != b"blob":
                          continue
                      object_id, _, raw_size = fields
                      object_sizes[object_id] = int(raw_size)

                  for object_id, path in history_entries:
                      size = object_sizes.get(object_id)
                      if size is None:
                          continue
                      history_blob_count += 1
                      if is_generated_artifact(path):
                          failures.append(f"generated build/test artifact entered history: {path}")
                      if is_forbidden_audit_evidence(path):
                          failures.append(f"raw/non-current audit evidence entered history: {path}")
                      if is_forbidden_public_raw(path):
                          failures.append(f"raw archive/dump entered public history: {path}")
                      if size > MAX_SINGLE_FILE:
                          failures.append(
                              f"history blob exceeds 100 MiB: {path} ({size} bytes)"
                          )
                      elif size >= MAX_NEW_TRACKED and not is_runtime_allowed(path):
                          failures.append(
                              f"history blob exceeds 5 MiB: {path} ({size} bytes)"
                          )
                      if (
                          PurePosixPath(path).suffix.lower() in MEDIA_OR_JSON_SUFFIXES
                          and not is_runtime_allowed(path)
                      ):
                          history_non_runtime_media.append((path, size))

          media_bytes = sum(size for _, size in non_runtime_media)
          media_count_budget = (
              MAX_REPOSITORY_NON_RUNTIME_MEDIA_COUNT
              if full_tree_scan
              else MAX_NON_RUNTIME_MEDIA_COUNT
          )
          if media_budget_exceeded(non_runtime_media, media_count_budget):
              failures.append(
                  "non-runtime JSON/image addition exceeds budget: "
                  f"{len(non_runtime_media)} files (budget {media_count_budget}), {media_bytes} bytes"
              )

          history_media_bytes = sum(size for _, size in history_non_runtime_media)
          if media_budget_exceeded(history_non_runtime_media, MAX_NON_RUNTIME_MEDIA_COUNT):
              failures.append(
                  "non-runtime JSON/image history additions exceed budget since policy baseline: "
                  f"{len(history_non_runtime_media)} blobs (budget {MAX_NON_RUNTIME_MEDIA_COUNT}), "
                  f"{history_media_bytes} bytes"
              )

          untracked_raw = run_bytes("git", "ls-files", "--others", "--exclude-standard", "-z")
          ignored_raw = run_bytes(
              "git", "ls-files", "--others", "--ignored", "--exclude-standard", "-z"
          )
          untracked_paths = {
              item.decode("utf-8", errors="surrogateescape").replace("\\", "/")
              for item in (untracked_raw + ignored_raw).split(b"\0")
              if item
          }
          untracked_generated = [
              path for path in untracked_paths
              if "node_modules" not in PurePosixPath(path).parts
              and (is_generated_artifact(path) or is_audit_evidence(path))
          ]
          if len(untracked_generated) > MAX_UNTRACKED_COUNT:
              failures.append(
                  "untracked generated-file budget exceeded: "
                  f"{len(untracked_generated)} > {MAX_UNTRACKED_COUNT}"
              )

          print(f"Storage budget base: {base or '<initial tree>'}")
          print(f"New tracked files checked: {len(changed)}")
          print(f"Tracked files scanned for forbidden output: {len(scan_paths)}")
          print(f"Full-tree forbidden-output scan: {full_tree_scan}")
          print(f"New history blobs checked: {history_blob_count}")
          print(f"Storage policy history baseline: {POLICY_HISTORY_BASE_SHA}")
          print(
              "Non-runtime JSON/image history additions: "
              f"{len(history_non_runtime_media)} blobs, {history_media_bytes} bytes"
          )
          print(f"Untracked generated files (ignored included): {len(untracked_generated)}")
          if allowed_large:
              print("Reviewed runtime allowlist accepted these >5 MiB files:")
              for entry in allowed_large:
                  print(f"  - {ascii(entry)}")

          if failures:
              print("::error::Repository storage budget failed")
              for failure in sorted(set(failures)):
                  # PR paths are untrusted data under pull_request_target. ASCII
                  # representation prevents newline/ANSI/workflow-command injection.
                  print(f"  - {ascii(failure)}")
              sys.exit(1)

          print("Repository storage budget passed.")
          PY

  publish-target-status:
    name: publish-repository-hygiene-status
    if: ${{ always() && (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.target_sha != '')) }}
    needs:
      - repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish immutable inspected-commit status
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || inputs.target_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_RESULT: ${{ needs.repository-hygiene.result }}
          STATUS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          sha = os.environ.get("TARGET_SHA", "")
          if len(sha) != 40 or any(character not in "0123456789abcdef" for character in sha):
              print("::error::Invalid immutable status target SHA")
              sys.exit(1)

          scan_passed = os.environ.get("SCAN_RESULT") == "success"
          request_id = os.environ.get("REQUEST_ID", "")
          if request_id and (
              not request_id.startswith("automation-")
              or any(character not in "abcdefghijklmnopqrstuvwxyz0123456789-" for character in request_id)
          ):
              print("::error::Invalid trusted automation request identifier")
              sys.exit(1)
          request_suffix = f" [{request_id}]" if request_id else ""
          payload = json.dumps({
              "state": "success" if scan_passed else "failure",
              "context": "repository-hygiene-target",
              "description": (
                  "Trusted storage policy passed" if scan_passed else "Trusted storage policy failed"
              ) + request_suffix,
              "target_url": os.environ["RUN_URL"],
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 201:
                      raise RuntimeError(f"unexpected status {response.status}")
          except Exception as error:
              print(f"::error::Unable to publish trusted storage status: {type(error).__name__}")
              sys.exit(1)

          if not scan_passed:
              print("::error::Trusted storage scan failed; failure status was published.")
              sys.exit(1)
          print("Trusted repository-hygiene-target status published.")
          PY
