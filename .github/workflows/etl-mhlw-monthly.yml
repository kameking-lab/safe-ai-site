name: MHLW monthly sokuhou ETL

on:
  schedule:
    # 毎月15日 09:00 JST = 00:00 UTC（月次速報の公開タイミングに余裕を持たせる）
    - cron: "0 0 15 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Install deps (xlsx/tsx)
        run: npm ci

      - name: Fetch MHLW monthly sokuhou (analysis Excel)
        run: npx tsx scripts/etl/mhlw-monthly-fetch.ts
        env:
          NODE_OPTIONS: "--no-warnings"

      - name: Commit if changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/src/data/accidents/monthly-sokuhou.json; then
            echo "No sokuhou changes"
            exit 0
          fi
          git add web/src/data/accidents/monthly-sokuhou.json
          git config --local core.hooksPath /dev/null
          git commit -m "chore(accidents): MHLW monthly sokuhou update [skip ci]"
          git show HEAD:scripts/maintenance/push-with-storage-gate.sh | bash
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_ALLOWED_PATHS: web/src/data/accidents/monthly-sokuhou.json
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
