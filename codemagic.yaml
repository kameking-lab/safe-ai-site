workflows:
  anzen-ios-app-store:
    name: Anzen AI - App Store Connect upload only
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feat/ios-app-*"
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "mobile/**"
          - "web/**"
          - "codemagic.yaml"
    integrations:
      # Reuse the existing integration in the same Apple Developer team.
      app_store_connect: App Store Key
    environment:
      ios_signing:
        # Existing Kakomon references bootstrap the signing identity before scripts.
        # App-specific profiles are created/downloaded through the ASC API below.
        provisioning_profiles:
          - kakomon_appstore
        certificates:
          - kameking_distribution
      vars:
        APP_STORE_APPLE_ID: "6831079439"
        ANZEN_APNS_ENVIRONMENT: production
        CI: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        CAPACITOR_TELEMETRY_DISABLED: "1"
      node: "22.23.4"
      xcode: latest
    scripts:
      - name: Prepare App Store profiles with the existing distribution identity
        script: |
          set -euo pipefail
          python3 -m venv /tmp/cm7-signing-venv
          /tmp/cm7-signing-venv/bin/pip install --disable-pip-version-check --quiet codemagic-cli-tools==0.70.2
          /tmp/cm7-signing-venv/bin/python "$CM_BUILD_DIR/mobile/scripts/asc_signing.py"
      - name: Install locked app and canonical web dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/web"
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install prisma generate --no-hints
          cd "$CM_BUILD_DIR/mobile"
          npm ci --no-audit --no-fund
          gem install xcodeproj -v 1.27.0 --no-document
      - name: Typecheck, test and bundle local screens (outbound network blocked)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npm run typecheck
          npm test
          npm run build
      - name: Select next App Store Connect build number
        script: |
          set -euo pipefail
          if [[ ! "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]]; then
            echo "Replace APP_STORE_APPLE_ID with the numeric ID of the Anzen app record." >&2
            exit 1
          fi
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          # Build 10 is already reported as submitted. Empty/API failures stop.
          # Run uploads serially: querying ASC does not reserve a build number.
          NEXT_BUILD_NUMBER=$(node scripts/next-build-number.mjs "$LATEST_BUILD_NUMBER")
          echo "BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"
      - name: Generate and verify native SPM project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npm run ios:prepare
          npm run ios:test
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy ios/App/App/App.entitlements
      - name: Apply and verify App Store provisioning
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          mkdir -p build/ios
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj \
            --profile "$HOME/Library/MobileDevice/Provisioning Profiles/*.mobileprovision" \
            --archive-method app-store \
            --export-options-plist build/ios/export_options.plist
          ruby scripts/verify-ios.rb build/ios/export_options.plist
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release \
            --export-options-plist build/ios/export_options.plist \
            --ipa-directory build/ios/ipa
    artifacts:
      - $CM_BUILD_DIR/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload only: no TestFlight distribution, beta groups or App Review submission.
        submit_to_testflight: false
        submit_to_app_store: false

  # Listing tags only. Existing signed IPA workflow is unchanged.
  anzen-asc-metadata:
    name: Anzen AI - App Store listing and screenshots
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "asc-anzen-*"
          include: true
      cancel_previous_builds: false
    integrations:
      app_store_connect: App Store Key
    environment:
      vars:
        APP_STORE_APPLE_ID: "6831079439"
        ASC_APP_VERSION: "1.0.0"
        SUBMIT_FOR_REVIEW: "false"
      node: "22.23.4"
      ruby: "3.4.7"
      xcode: latest
    scripts:
      - name: Resolve dedicated tag into non-secret request parameters
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          # Only version/build/submission are written; never export review secrets.
          ruby scripts/asc_config.rb >> "$CM_ENV"
      - name: Validate request and emit API follow-up report
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          mkdir -p build/asc
          cp asc/api-followup.md build/asc/asc-api-followup.md
          python3 scripts/asc_validate.py --screenshots
          ruby -r ./scripts/asc_config -e 'AscConfig.read(ENV); puts "ASC request validation PASS"'
      - name: Authenticate with the existing integration using official Codemagic tooling
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          python3 -m venv .cache/asc-auth-venv
          .cache/asc-auth-venv/bin/pip install --disable-pip-version-check -r asc/auth-requirements.txt
          # Only this non-secret executable path crosses build steps.
          # Keys/JWTs never go to CM_ENV, arguments, artifacts or a disk cache.
          echo "ASC_SETUP_PYTHON=$PWD/.cache/asc-auth-venv/bin/python" >> "$CM_ENV"
          .cache/asc-auth-venv/bin/python scripts/asc_auth.py --check
      - name: Install screenshot validation and listing upload dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npm ci
          node scripts/asc_repository_check.mjs
          bundle config set --local path vendor/bundle
          bundle config set --local frozen true
          bundle install
      - name: Upload listing and screenshots only (review submission disabled)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          # Listing-only lane; review submission and automatic release are hard-disabled.
          FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_HIDE_CHANGELOG=1 \
            bundle exec fastlane ios asc_metadata
    artifacts:
      - mobile/fastlane/screenshots/ja/*.jpg
      - mobile/fastlane/screenshots/manifest.json
      - mobile/build/asc/*.md
      - mobile/build/asc/result.json
